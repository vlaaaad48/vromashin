<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111214" />
    <link rel="icon" href="./favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="./favicon.png?v=2" />
    <title>Кейс — Владислав Ромашин</title>
    <script>
      (() => {
        const platform = [navigator.userAgentData?.platform, navigator.platform, navigator.userAgent].filter(Boolean).join(' ')
        if (/(Windows|Win32|Win64|WOW64)/i.test(platform)) document.documentElement.classList.add('is-windows')
        const theme = localStorage.getItem('portfolio-theme-v2') || 'dark'
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        try {
          if (sessionStorage.getItem('portfolio-skip-page-loader') === 'true') {
            document.documentElement.dataset.skipPageLoader = 'true'
          }
        } catch {}
        const project = new URLSearchParams(window.location.search).get('project')
        if (project) document.documentElement.dataset.project = project
      })()
    </script>
    <style>
      body.is-page-loading > *:not(.page-loader) { visibility: hidden; }
      .page-loader { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; align-content: center; gap: 14px; background: #111214; color: #f7f7f8; }
      .page-loader__orb { width: 34px; height: 34px; border: 2px solid rgba(247,247,248,.18); border-top-color: #f7f7f8; border-radius: 50%; animation: page-loader-spin 800ms linear infinite; }
      .page-loader__label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: .64; }
      html[data-skip-page-loader] .page-loader { display: none; }
      html[data-skip-page-loader] body.is-page-loading > *:not(.page-loader) { visibility: visible; }
      @keyframes page-loader-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="./assets/project-BRF10Gub.js"></script>
